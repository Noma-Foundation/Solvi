<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="description" content="OrderHub is an order management for enterprise business.">
    <meta name="keywords" content="OrderHub, order management, enterprise business, B2B">
    <title>OrderHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/app.css" />
    <link rel="stylesheet" href="./src/components/menu-bar/menu-bar.css">
    <link rel="stylesheet" href="./src/components/search-bar/search-bar.css">
    <link rel="stylesheet" href="./src/components/notification-bell/notification-bell.css">
    <link rel="stylesheet" href="./src/components/setting/setting.css">

<body>
    <header id="app-header" class="d-flex justify-content-end align-items-center gap-3 me-md-1"></header>
    <div class="container-fluid m-0 p-0 d-flex vh-100">
        <aside id="main-menu-bar" class="m-2 overflow-hidden"></aside>
        <main id="main-context" class="flex-grow-1 overflow-auto d-flex justify-content-center align-items-center">
            <section id="app-main-context"></section>

        <p class="text-end m-0 p-0"><span id="app-version">1.0.0</span></p>
    </footer>
    <script src="./src/main.js" type="module"></script>
