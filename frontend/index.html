<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="description" content="Solvi is an CRM for enterprise business.">
    <meta name="keywords" content="Solvi, CRM, enterprise business, B2B">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
    <title>Solvi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/app.css" />
    <link rel="stylesheet" href="./src/components/menu-bar/menu-bar.css">
    <link rel="stylesheet" href="./src/components/setting/setting.css">
</head>

<body class="d-flex vh-100">
    <aside id="main-menu-bar" class="m-0 overflow-hidden"></aside>
    <div class="d-flex flex-column flex-grow-1 overflow-hidden" style="min-width: 0;">
        <header id="app-header" class="d-flex justify-content-end align-items-center gap-2"></header>
        <main id="main-context" class="flex-grow-1 overflow-auto">
            <section id="app-main-context" class="container-fluid h-100 w-100 m-0 p-0"></section>
        </main>
    </div>
    <!-- display the system version at the right-bottom corner -->
    <footer id="app-footer" class="container-fluid p-0 m-0 position-absolute bottom-0 pe-2 pb-1">
        <p class="text-end m-0 p-0"><span id="app-version">1.0.0</span></p>
    </footer>
    <script src="./src/main.js" type="module"></script>
</body>

</html>
