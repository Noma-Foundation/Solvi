<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        :root {
            --orderhub-brand-color: #2745FE;
            --accent-color: #360A73;
            --light-blue-color: #27B5FE;
            --light-color: #FFFFFF;
            --color-black: #000;  
        }

        #form { 
            border-radius: 16px;
            padding: 16px 8px;
        }
    </style>
</head>
<body>
    <div class="container-fluid d-flex gap-4">
        <div>
            <h1><span style="color: var(--orderhub-brand-color); font-weight: 500; margin-bottom: 0;">Solvi</span></h1>
            
            <form class="form d-flex">
                <div class="container">
                    <label for="text">Vamos começar?</label>
                    <input type="text" placeholder="Username ou email">
                    <input type="text" placeholder="Senha">
                </div>

                <div>
                    <input type="checkbox" name="remember-me" id="remember-me"><span>Lembre-se de mim</span>
                    <button class="btn">Esqueceu sua senha?</button>
                </div>

                <button class="btn btn-primary" type="submit">Login</button>

            </form>

        </div>

        <div>
            <h1>Olá<br>Bem-vindo à Solvi!</h1>
            <h3>Não tem uma conta? <span>Crie uma agora mesmo!</span></h3>
            <button class="btn">Criar Conta</button>
        </div>
    </div>
</body>
</html>
