<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugdets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        :root { 
            --orderhub-brand-color: #2745FE;
            --accent-color: #360A73;
            --light-blue-color: #27B5FE;
            --light-color: #FFFFFF;
            --color-black: #000;
        }

        .search-input .form-control,
        .search-input .btn {
            height: 38px;
        }

        .search-input .btn {
            border-color: #dee2e6;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .search-input .btn:hover {
            background-color: #e9ecef;
        }

        .date-picker {
            height: 38px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 0.875rem;
            color: #495057;
            background-color: #fff;
            cursor: pointer;
        }

        .date-picker:focus {
            outline: none;
            border-color: var(--orderhub-brand-color);
            box-shadow: 0 0 0 0.2rem rgba(39, 69, 254, 0.15);
        }

        .btn-new-budget {
            background-color: var(--orderhub-brand-color);
            border: none;
            border-radius: 6px;
            height: 38px;
            padding: 0 18px;
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .btn-new-budget:hover {
            background-color: #1c36e0;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <header class="p-3 pb-2">
            <h3 class="mb-1">Valores de entrada</h3>
            <p class="text-secondary mb-0">Crie e organize valores de entrada e saída de seu negócio.</p>
        </header>

        <section class="px-3 pb-3">
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <!-- Search -->
                <div class="input-group search-input" style="max-width: 280px;">
                    <button class="btn btn-outline-secondary" type="button">
                        <img src="./assets/search_icon.svg" alt="Search" width="16" height="16">
                    </button>
                    <input type="text" class="form-control" placeholder="Pesquisar..." aria-label="Pesquisar orçamentos">
                </div>

                <!-- Date picker -->
                <input type="date" class="date-picker" title="Filtrar por data">

                <!-- New budget button -->
                <button class="btn btn-primary btn-new-budget ms-auto">Novo Orçamento</button>
            </div>
        </section>
    </div>
</body>
</html>
