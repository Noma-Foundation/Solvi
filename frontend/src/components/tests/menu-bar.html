<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuBar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        :root {
            --orderhub-brand-color: #2745FE;
            --accent-color: #360A73;
            --light-blue-color: #27B5FE;
            --light-color: #FFFFFF;
            --color-black: #000;

            --nav-collapsed-width: 56px;
            --nav-expanded-width: 200px;
            --nav-transition: 220ms ease;
        }

        .navigation-bar {
            width: var(--nav-collapsed-width);
            min-height: 100vh;
            overflow: hidden;
            transition: width var(--nav-transition);
            background-color: #fff;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            padding: 8px 0;
        }

        .navigation-bar:hover {
            width: var(--nav-expanded-width);
        }

        .navigation-bar ul {
            padding: 0;
            margin: 0;
            list-style: none;
            width: 100%;
        }

        .navigation-bar ul li.nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 44px;
            padding: 0 8px;
            margin: 2px 6px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            transition: background-color 0.15s, scale 0.1s;
        }

        .nav-item .nav-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item .nav-icon img {
            width: 22px;
            height: 22px;
        }

        .nav-item .nav-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #1f2328;
            opacity: 0;
            transition: opacity var(--nav-transition);
            pointer-events: none;
        }

        .navigation-bar:hover .nav-item .nav-label {
            opacity: 1;
        }

        .nav-item.selected {
            background-color: var(--orderhub-brand-color);
        }

        .nav-item.selected .nav-label {
            color: #fff;
        }

        .nav-item.selected .nav-icon img {
            filter: brightness(0) invert(1);
        }

        .nav-item.unselected:hover {
            background-color: #f0f2ff;
            scale: 1.02;
        }

        .nav-item.unselected .nav-icon img {
            filter: brightness(0) saturate(100%) invert(10%) sepia(87%) saturate(5147%) hue-rotate(253deg) brightness(83%) contrast(115%);
        }
    </style>
</head>
<body>
    <nav class="navigation-bar" aria-label="Main navigation">
        <ul>
            <li class="selected nav-item" id="home-page" role="button" tabindex="0" title="Home">
                <span class="nav-icon">
                    <img src="./assets/aside/home.svg" alt="" loading="lazy">
                </span>
                <span class="nav-label">Home</span>
            </li>
            <li class="unselected nav-item" id="customer-page" role="button" tabindex="0" title="Customer">
                <span class="nav-icon">
                    <img src="./assets/aside/customer.svg" alt="" loading="lazy">
                </span>
                <span class="nav-label">Customer</span>
            </li>
            <li class="unselected nav-item" id="inbox-page" role="button" tabindex="0" title="Inbox">
                <span class="nav-icon">
                    <img src="./assets/aside/inbox.svg" alt="" loading="lazy">
                </span>
                <span class="nav-label">Inbox</span>
            </li>
            <li class="unselected nav-item" id="calendar-page" role="button" tabindex="0" title="Calendar">
                <span class="nav-icon">
                    <img src="./assets/aside/calendar.svg" alt="" loading="lazy">
                </span>
                <span class="nav-label">Calendar</span>
            </li>
            <li class="unselected nav-item" id="notifications-page" role="button" tabindex="0" title="Notifications">
                <span class="nav-icon">
                    <img src="./assets/aside/notifications.svg" alt="" loading="lazy">
                </span>
                <span class="nav-label">Notifications</span>
            </li>
        </ul>
    </nav>

    <script>
        const navItems = document.querySelectorAll('.navigation-bar .nav-item');

        navItems.forEach(function (item) {
            item.addEventListener('click', function () {
                navItems.forEach(function (el) {
                    el.classList.replace('selected', 'unselected');
                });
                item.classList.replace('unselected', 'selected');
            });
        });
    </script>
</body>
</html>
