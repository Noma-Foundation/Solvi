<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .search-bar {
            display: flex;
            flex-wrap: nowrap;
            background-color: #ECE6F0;
            border-radius: 28px;
            width: fit-content;
            height: fit-content;
        }

        .search-bar img {
            padding: 8px;
            cursor: pointer;
            margin-right: 8px;
        }

        #search-bar-input {
            background-color: transparent;
            padding: 8px 24px 8px 24px;
            margin-left: 8px;
            border: none;
            width: 18.75rem;
            height: 3rem;
        }

        #search-bar-input:focus {
            outline: none;
        }
    </style>

</head>

<body style="background-color: #3f3f3f;">

    <div class="search-bar container p-0">
        <input type="text" name="searchBar" id="search-bar-input" aria-label="Search"
            placeholder="Search a ticket, folder or budget" tabindex="0">
        <img src="./assets/icons/search_bar_icons/search.svg" alt="Search Button" role="button" tabindex="0">
    </div>

    <script></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
