<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- This options is used to display various information related to orders -->
    <!-- Is used for beta testing -->
    <!-- Import Bootstrap CSS Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <style>
        .fab-button {
            display: flex;
            align-items: center;
            justify-content: center;

            height: 56px;
            gap: 24px;
            background-color: #2745FE;
            border-radius: 16px;
            cursor: pointer;
        }

        .fab-button h6 {
            margin: 0px;
            text-align: center;
            text-wrap: wrap;
        }
    </style>

<body>
    <section class="container d-flex gap-4 justify-content-center align-items-center vh-100">

            <div class="fab-button"></div>
            <h6>Add ticket</h6>
        </article>
        <article class="d-flex flex-column gap-2 justify-content-center align-items-center">
            <div class="fab-button"></div>
            <h6>View tickets</h6>
        </article>
        <article class="d-flex flex-column gap-2 justify-content-center align-items-center">

            <h6>Remove ticket</h6>
        </article>
    </section>
