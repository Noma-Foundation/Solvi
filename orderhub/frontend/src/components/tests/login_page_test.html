<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Login</title>
    <style>
        #app-login-form input {
            border: 1px solid #11111149;
            padding: 4px 8px;
            border-radius: 6px;
        }

        #app-login-form input:focus {
            outline: none;
        }

        #login-btn {
            background-color: #2745FE;
        }

        #register-btn {
            border: 1px solid #CAC4D0;
            background-color: #fff;
            color: #49454F;
        }
    </style>
</head>

<body>

    <form id="app-login-form">
        <div class="container-fluid m-0 p-3 bg-light">
            <div class="form-group d-flex flex-column gap-2">
                <input type="text" name="userAccess" id="user-access" placeholder="Username or email..." required>
                <input type="password" name="userPassword" id="user-password" placeholder="Password..." required>
            </div>
            <div class="form-group d-flex flex-row gap-2 mt-2">
                <button id="login-btn" class="btn btn-primary w-50" type="submit">Login</button>
                <button id="register-btn" class="btn btn-secondary w-50" type="button">Register</button>
            </div>
        </div>
    </form>

    <script>
        const adminLogin = {
            user: "admin",
            password: "admin"
        };

        function validateAdminLogin(userName, password) {
            // Use JWT for admin authentication
            if (userName == adminLogin.user && password == adminLogin.password) {
                return true;
            }
            return false;
        }

        function openApplicationContext(userAccess, userPassword) {
            let context = "login"; // login, admin, user enum
            const isAdminLogin = validateAdminLogin(userAccess, userPassword);

            if (isAdminLogin) {
                // Enter admin page context
                console.log("%cEnter Admin Context", "font-size: 14px; color: #cecece;");
                context = "admin";
            } else {
                // Enter user page context
                // Verify permissions
                console.log("%cEnter User Context", "font-size: 14px; color: #cecece;");
                context = "user";
            }

            console.log("%cContext: " + context, "font-size:16px; color: red;");

        }

        window.onload = () => {
            const loginForm = document.getElementById("app-login-form");
            const registerBtn = document.getElementById("register-btn");
            const userAccessElement = document.getElementById("user-access");
            const userPasswordElement = document.getElementById("user-password");

            userAccessElement.addEventListener("change", () => {
                const access = userAccessElement.value;
                const token = window.sessionStorage.getItem("user-access");
                if (token !== access) {
                    window.sessionStorage.setItem("user-access", access);
                }
                if (token !== null) {
                    userPasswordElement.value = window.sessionStorage.getItem("user-password");
                }
            });

            userPasswordElement.addEventListener("change", () => {
                const password = userPasswordElement.value;
                window.sessionStorage.setItem("user-password", password);
            });

            loginForm.addEventListener("submit", (event) => {
                event.preventDefault();
                const userAccess = userAccessElement.value;
                const userPassword = userPasswordElement.value;
                openApplicationContext(userAccess, userPassword);
            });

            registerBtn.addEventListener("click", () => {
                console.log("Register Clicked");
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
