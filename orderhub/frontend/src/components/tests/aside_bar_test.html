<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aside bar</title>

    <style>
        .navigation-bar ul {
            padding: 0;
            margin: 0;
        }

        .navigation-bar ul li {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            margin: 4px;
            cursor: pointer;
        }

        .selected {
            background-color: #2745fe;
        }

        .unselected {
            background-color: #cecece;
            transition: scale 0.1s;
        }

        .unselected:hover {
            scale: 1.1;
            background-color: #b6b6b6;
        }

        .unselected img {
            filter: brightness(0) saturate(100%) invert(10%) sepia(87%) saturate(5147%) hue-rotate(253deg) brightness(83%) contrast(115%);
            width: 24px;
            height: 24px;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <aside>
            <nav class="navigation-bar">
                <ul>
                    <li class="selected">
                        <img src="assets/icons/aside_bar_icons/home.svg" alt="Home">
                    </li>
                    <li class="unselected">
                        <img src="assets/icons/aside_bar_icons/folder.svg" alt="Folder">
                    </li>
                    <li class="unselected">
                        <img src="assets/icons/aside_bar_icons/customer.svg" alt="Customer">
                    </li>
                    <li class="unselected">
                        <img src="assets/icons/aside_bar_icons/inbox.svg" alt="Inbox">
                    </li>
                    <li class="unselected">
                        <img src="assets/icons/aside_bar_icons/notifications.svg" alt="Notifications">
                    </li>
                </ul>
            </nav>
        </aside>
    </div>

    <script>
        let navButtons = document.querySelectorAll(".navigation-bar ul li");
        let currentSelected = document.querySelector(".selected");

        for (let i = 0; i < navButtons.length; i++) {

            navButtons[i].addEventListener("click", function () {
                if (this.classList.contains("unselected")) {
                    changeSelected(this);
                }
                else {
                    console.log("Already selected");
                }
            })
        }

        function changeSelected(element) {
            element.classList.remove("unselected");
            element.classList.add("selected");
            currentSelected.classList.remove("selected");
            currentSelected.classList.add("unselected");
            currentSelected = element;
        }
    </script>
</body>

</html>
