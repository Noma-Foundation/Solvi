<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Component Full Animation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Oxygen,
                Ubuntu,
                Cantarell,
                "Open Sans",
                "Helvetica Neue",
                sans-serif;
        }

        .card-ticket-closed {
            max-width: 360px;
            border: 1px solid #c4c4d0;
            border-radius: 12px;
            cursor: pointer;
            animation-name: ticketAnimation;
            animation-duration: 3s;
        }

        .card-ticket-closed .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: none;
            flex-wrap: wrap;
        }

        .card-ticket-closed .card-header button.btn-light {
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid #c4c4d0;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .card-ticket-closed .card-header button.btn-light img {
            width: 24px;
            height: 24px;
        }

        @keyframes ticketAnimation {
            from {}

            to {}
        }
    </style>
</head>

<body>
    <main>
        <div class="card card-ticket-closed" data-href="ticket.html">
            <div class="card-header m-0">
                <div>
                    <p class="h5">Ticket - #49801</p>
                    <p>Client Name</p>
                </div>
                <button class="btn btn-light" arial-label="Archive" onclick="window.alert('Archived')">
                    <img src="./assets/icons/move_to_inbox.png" />
                </button>
            </div>
        </div>
    </main>

    <script>
        const ticket = document.querySelector('.card-ticket-closed');
        let isPressed = false;

        function handleMouseDownEvent() {
            console.log("Ticket is pressed")
            isPressed = true;
        }

        function handleMouseOut() {
            console.log("Ticket is out");
            isPressed = false;
        }

        function startAnimation() {
        }

        ticket.addEventListener("mousedown", handleMouseDownEvent);
        ticket.addEventListener("mouseout", handleMouseOut);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
