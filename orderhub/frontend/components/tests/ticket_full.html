<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ticket Component</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <style>
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
            }

            .card-ticket-open {
                max-width: 360px;
                border: 1px solid #c4c4d0;
                border-radius: 12px;
                overflow: hidden;
            }

            .card-ticket-open .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 16px 8px;
                background: transparent;
                border-bottom: 0px;
            }

            .card-ticket-open .card-body {
                padding: 8px 16px 16px;
                background: transparent;
                border: 0px;
            }

            .card-ticket-open .card-body .ticket-budget {
                color: #068e36;
            }

            .card-ticket-open .card-footer {
                display: flex;
                justify-items: right;
                justify-content: flex-end;
                align-items: center;
                padding: 0 16px 16px;
                background: transparent;
                border-top: 0px;
            }

            .card-ticket-open .card-footer div {
                /* Space between buttons */
                display: flex;
                gap: 8px;
            }

            .card-ticket-open .card-footer button {
                /* Global ticket button style */
                padding: 8px 16px 10px;
                border-radius: 24px;
                /* Text */
                text-align: center;
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.03em;
            }

            .card-ticket-open .card-footer button.btn-light {
                background: transparent;
                border: 1px solid #c4c4d0;
                color: #49454f;
            }

            .card-ticket-open .card-footer button.btn-primary {
                background-color: #2745fe;
                border: none;
            }

            /*
             * Button hover effects
             */
        </style>
    </head>
    <body>
        <main>
            <div class="card card-ticket-open">
                <div class="card-header m-0">
                    <div>
                        <p class="h5">Ticket - #49801</p>
                        <p>Client Name</p>
                    </div>
                    <button class="btn btn-light" aria-label="More options">
                        <img src="./assets/icons/more_icon.png" alt="" />
                    </button>
                </div>
                <div class="card-body">
                    <div>
                        <p class="h6">
                            Budget:
                            <strong class="ticket-budget">R$1985,84</strong>
                        </p>
                        <p>Address</p>
                    </div>
                    <p>
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit,
                        sed do eiusmod tempor...
                    </p>
                </div>
                <div class="card-footer">
                    <div>
                        <button class="btn btn-light button-edit-ticket">
                            Edit ticket
                        </button>
                        <button class="btn btn-primary button-close-ticket">
                            Close ticket
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
