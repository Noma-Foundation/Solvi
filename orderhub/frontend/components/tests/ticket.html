<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ticket Component</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <style>
            body {
                font-family: "Roboto", Arial, sans-serif;
            }

            .card-ticket-closed .card-header {
                display: flex;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="card card-ticket-closed">
                <div class="card-header m-0">
                    <div>
                        <p class="h5">Ticket - #49801</p>
                        <p>Client Name</p>
                    </div>
                    <button class="btn btn-light" arial-label="Archive">
                        <img src="./assets/icons/move_to_inbox.png" />
                    </button>
                </div>
            </div>
        </main>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
