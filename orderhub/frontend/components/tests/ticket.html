<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ticket Component</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <style>
            body {
                font-family: "Roboto", Arial, sans-serif;
            }

            .card-container {
                max-width: 600px;
                margin: 0 auto;
            }

            .card-header {
                padding: 16px;
                border-bottom: 1px solid #e0e0e0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .ticket-card {
                background: #fef7ff;
                border: 1px solid;
                border-radius: 16px;
                box-shadow: 0 1px 2px rgba(35, 31, 37, 0.08);
                cursor: pointer;
            }

            .ticket-card h5 {
                font-weight: 500;
            }

            .ticket-action {
                padding: 6px;
                background-color: #fff;
                border: 2px solid #cecece;
                border-radius: 50%;
                line-height: 1;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .ticket-action img {
                width: 24px;
                height: 24px;
                display: block;
            }
        </style>
    </head>
    <body>
        <main>
            <!-- Simple card description -->
            <div class="container py-4 card-container">
                <div class="card row justify-content-center">
                    <div class="card-body">
                        <article class="card ticket-card border-0">
                            <div class="card-header">
                                <div class="container">
                                    <h5 class="card-title ticket-title mb-2">
                                        Ticket - #48791
                                    </h5>
                                    <p
                                        class="card-subtitle ticket-subtitle mb-0"
                                    >
                                        Peter
                                    </p>
                                </div>

                                <button
                                    class="btn ticket-action"
                                    autocomplete="off"
                                >
                                    <img
                                        src="assets/icons/move_to_inbox.png"
                                        alt="Archive"
                                    />
                                </button>
                            </div>
                        </article>
                    </div>
                    <div></div>
                </div>
            </div>
        </main>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
